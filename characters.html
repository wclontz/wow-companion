<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Characters</title>
<style>
:root{
  --bg:#0d0b09; --panel:#17130f; --panel2:#1f1a14; --line:#3a2f22;
  --gold:#e8c26a; --gold2:#b8913f; --text:#e9e1d3; --dim:#9a8f7e;
  --red:#e0523f; --xp:#a24fe0; --green:#3fbf4f; --blue:#5fb6ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(#1c160f,#110e0a)}
header h1{margin:0;font-size:22px;color:var(--gold);font-family:Georgia,serif;letter-spacing:.5px}
header a{color:var(--gold2);text-decoration:none;font-size:14px}
header .sp{margin-left:auto}
main{display:grid;gap:12px;padding:12px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.top h2{margin:0;font:600 24px Georgia,serif;color:var(--gold)}
.top .lvl{font-size:18px;color:var(--xp);font-weight:700}
.dim{color:var(--dim)} .small{font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:8px 26px;margin:10px 0 4px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.charts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px}
.chart{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.chart h3{margin:0 0 4px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold2);font-weight:600}
.chart canvas{display:block;width:100%;height:150px}
table{border-collapse:collapse;margin-top:12px;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:3px 16px 3px 0;border-bottom:1px solid #2a2219}
th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.empty{padding:30px 16px;color:var(--dim)}
.range{display:flex;gap:6px}
.range button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.range button.on{color:#1a1206;background:var(--gold2);border-color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>Characters</h1>
  <span class="dim small">progress over time, one line saved every few minutes while you play</span>
  <span class="range sp" id="range"></span>
  <a href="/hud">HUD →</a> <a href="/">all the numbers →</a>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const RANGES = [["Day", 86400], ["Week", 7 * 86400], ["Month", 31 * 86400], ["All", 0]];
let D = null, span = 0;
try { span = +(localStorage.getItem("charSpan") || 0); } catch (e) {}

function coins(c){
  if (c == null) return "—";
  const g = Math.floor(c / 10000), s = Math.floor(c % 10000 / 100), k = c % 100;
  return (g ? g + "g " : "") + (g || s ? s + "s " : "") + k + "c";
}
function dur(s){
  if (!s) return "—";
  const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
function day(t){ return new Date(t * 1000).toLocaleDateString(undefined, {month: "short", day: "numeric"}); }
function when(t){ return new Date(t * 1000).toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}); }

// one line over time: pts = [[t, value]...] (nulls left out), drawn as steps when `steps`
function line(cv, pts, color, fmt, steps){
  const r = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * r); cv.height = Math.round(h * r);
  const ctx = cv.getContext("2d"); ctx.setTransform(r, 0, 0, r, 0, 0); ctx.clearRect(0, 0, w, h);
  ctx.font = "11px Segoe UI"; ctx.fillStyle = "#9a8f7e";
  pts = pts.filter(p => p[1] != null);
  if (!pts.length) { ctx.fillText("nothing saved yet", 8, h / 2); return; }
  const L = 44, R = 8, T = 8, B = 18;
  let t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  if (t1 - t0 < 60) { t0 -= 1800; t1 += 1800; }
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const X = t => L + (t - t0) / (t1 - t0) * (w - L - R), Y = v => T + (hi - v) / (hi - lo) * (h - T - B);
  ctx.strokeStyle = "#2f261b"; ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, y = Y(v);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - R, y); ctx.stroke();
    ctx.textAlign = "right"; ctx.fillText(fmt(v), L - 5, y + 4);
  }
  ctx.textAlign = "left"; ctx.fillText(day(t0), L, h - 4);
  ctx.textAlign = "right"; ctx.fillText(day(t1), w - R, h - 4);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.beginPath();
  pts.forEach((p, i) => {
    const x = X(p[0]), y = Y(p[1]);
    if (!i) ctx.moveTo(x, y); else { if (steps) ctx.lineTo(x, Y(pts[i - 1][1])); ctx.lineTo(x, y); }
  });
  ctx.stroke();
  const last = pts[pts.length - 1];
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(last[0]), Y(last[1]), 3.5, 0, 7); ctx.fill();
}

function render(){
  const main = $("main");
  $("range").innerHTML = RANGES.map(([n, s]) => `<button data-s="${s}" class="${s === span ? "on" : ""}">${n}</button>`).join("");
  if (!D || !D.chars.length) {
    main.innerHTML = `<div class="card empty">Nothing saved yet. A line is saved for the character you are playing every few minutes
      while the add-on's strip is being read, and at every level-up. Come back after playing a while.</div>`;
    return;
  }
  const now = Date.now() / 1000;
  main.innerHTML = D.chars.map((c, i) => {
    const n = c.now, pct = n.xpmax ? Math.round(n.xp / n.xpmax * 100) : null;
    const lv = c.levels.slice(-8).reverse();
    return `<section class="card">
      <div class="top"><h2>${esc(c.name)}</h2><span class="lvl">level ${n.level}${pct != null ? ` · ${pct}%` : ""}</span>
        <span class="dim small">${esc(n.zone || "")} · last seen ${when(n.t)} · logged since ${day(c.first_t)}</span></div>
      <div class="stats">
        <div class="stat"><b>${coins(n.money)}</b><span>money</span></div>
        <div class="stat"><b>${n.gear ?? "—"}</b><span>gear score${n.ilvl ? ` · item level ${n.ilvl}` : ""}</span></div>
        <div class="stat"><b>${dur(c.played)}</b><span>played while logged</span></div>
        <div class="stat"><b>${c.kills.toLocaleString()}</b><span>kills</span></div>
        <div class="stat"><b>${c.deaths}</b><span>deaths</span></div>
      </div>
      <div class="charts">
        <div class="chart"><h3>Level</h3><canvas id="lv${i}"></canvas></div>
        <div class="chart"><h3>Money</h3><canvas id="mo${i}"></canvas></div>
        <div class="chart"><h3>Gear score</h3><canvas id="ge${i}"></canvas></div>
        <div class="chart"><h3>Kills</h3><canvas id="ki${i}"></canvas></div>
      </div>
      ${lv.length > 1 ? `<table><tr><th>Level</th><th>First seen at it</th><th>Time played to the next</th></tr>
        ${lv.map((l, k) => { const nx = k ? lv[k - 1] : null;
          return `<tr><td>${l.level}</td><td>${when(l.t)}</td><td>${nx ? dur(nx.played - l.played) : '<span class="dim">in progress</span>'}</td></tr>`; }).join("")}</table>` : ""}
    </section>`;
  }).join("");
  D.chars.forEach((c, i) => {
    const s = span ? c.series.filter(p => p[0] >= now - span) : c.series;
    const use = s.length ? s : c.series.slice(-1);
    line($("lv" + i), use.map(p => [p[0], p[1]]), "#a24fe0", v => v.toFixed(1));
    line($("mo" + i), use.map(p => [p[0], p[2]]), "#e8c26a", v => (v / 10000).toFixed(v < 100000 ? 1 : 0) + "g");
    line($("ge" + i), use.map(p => [p[0], p[3]]), "#5fb6ff", v => Math.round(v), true);
    line($("ki" + i), use.map(p => [p[0], p[4]]), "#3fbf4f", v => Math.round(v));
  });
}

$("range").addEventListener("click", e => {
  if (e.target.dataset.s == null) return;
  span = +e.target.dataset.s;
  try { localStorage.setItem("charSpan", span); } catch (err) {}
  render();
});
async function tick(){
  try { D = await (await fetch("/api/characters", {cache: "no-store"})).json(); render(); }
  catch (e) { if (!D) $("main").innerHTML = `<div class="card empty">The companion is not answering.</div>`; }
}
tick(); setInterval(tick, 60000);
addEventListener("resize", () => D && render());
</script>
</body>
</html>
